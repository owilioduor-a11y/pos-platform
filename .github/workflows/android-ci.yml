name: Android CI

on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "android/**"
      - ".github/workflows/android-ci.yml"
  pull_request:
    paths:
      - "crates/**"
      - "android/**"
      - ".github/workflows/android-ci.yml"

jobs:
  native-lib:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain + Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Verify UniFFI Kotlin bindings are current
        run: |
          cargo build -p pos-core --lib
          cargo run -p pos-core --bin uniffi-bindgen -- generate \
            --library target/debug/libpos_core.so \
            --language kotlin \
            --out-dir "$RUNNER_TEMP/uniffi-kotlin" \
            --no-format
          git diff --no-index --exit-code \
            android/app/src/main/java/uniffi/pos_core/pos_core.kt \
            "$RUNNER_TEMP/uniffi-kotlin/uniffi/pos_core/pos_core.kt"

      - name: Build pos-core for Android
        run: |
          cargo ndk -t arm64-v8a -o android/app/src/main/jniLibs build -p pos-core --release

      - name: Upload native libs
        uses: actions/upload-artifact@v4
        with:
          name: pos-core-android
          path: android/app/src/main/jniLibs/**/*.so

  android-app:
    runs-on: ubuntu-latest
    needs: native-lib
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install Android SDK 34
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Restore native libs
        uses: actions/download-artifact@v4
        with:
          name: pos-core-android
          path: android/app/src/main/jniLibs

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon
