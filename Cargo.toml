[workspace]
resolver = "2"
members = ["crates/pos-domain", "crates/pos-core", "crates/pos-server"]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
pos-domain = { path = "crates/pos-domain" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
uuid = { version = "1", features = ["v7", "serde"] }
rust_decimal = { version = "1", features = ["serde-with-str", "maths"] }
