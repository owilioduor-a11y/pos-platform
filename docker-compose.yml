services:
  postgres:
    image: postgres:16-alpine
    container_name: pos-platform-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pos_platform
    ports:
      - "5432:5432"
    volumes:
      - pos_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pos_platform"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pos_pgdata:
